name: sahay_citizen_app
description: "Sahay Citizen, Driver & Bystander App - 24 Screens UI Architecture"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  geolocator: ^14.0.3
  flutter_tts: ^4.2.5
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^19.0.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  http: ^1.6.0
  permission_handler: ^12.0.3
  flutter_animate: ^4.5.2
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  # P0 Competition Features
  sensors_plus: ^6.1.1          # Real accelerometer crash detection
  pdf: ^3.11.2                  # PDF certificate generation
  printing: ^5.13.5             # PDF preview & print/share
  qr_flutter: ^4.1.0            # QR code in certificate
  share_plus: ^13.3.0           # Share certificate via WhatsApp
  path_provider: ^2.1.5         # Local file storage for PDFs
  speech_to_text: ^7.0.0        # Voice input for AI triage
  intl: ^0.19.0                 # Date/time formatting
  google_generative_ai: ^0.4.6  # Gemini API for AI triage
  uuid: ^4.5.1                  # Unique certificate IDs
  url_launcher: ^6.3.1          # Phone calls from offline mode
  audioplayers: ^6.7.1          # Audio playback for metronome
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/ambulance_rescue.jpg
    - assets/images/first_aid_check.jpg
    - assets/images/accident_scene.jpg
    - assets/images/motorcycle_accident.jpg
    - assets/images/cpr_first_aid.jpg
