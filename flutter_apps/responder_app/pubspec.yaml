name: responder_app
description: "Sahay Responder App — Real-time emergency dispatch and response"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.12.1
  cloud_firestore: ^6.7.1
  firebase_messaging: ^16.4.3
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  flutter_animate: ^4.5.2
  qr_flutter: ^4.1.0
  audioplayers: ^6.7.1
  geolocator: ^14.0.3
  http: ^1.6.0
  flutter_local_notifications: ^19.0.3
  permission_handler: ^12.0.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
